# CTIN：Contextual Transformer 惯性网络（Rao et al., AAAI 2022），逐帧 2D 速度 + 对角 log σ，
# 多任务（同方差不确定度加权）损失。**paper-only**：官方仓库只有 README/LICENSE，没有源码，
# 因此 docs/algorithms/ctin.md §4 的“参考规格”（d=64, heads=8, ff=512, groups=4, reduction=2）
# 才是本实现的依据。参数量 477,572（+2 个多任务权重 = 477,574）由单元测试锁定，
# 只有论文 Table 3 报告值 0.5571e6 的 85.7%——论文没有给出任何宽度，无法唯一复原该数字。
name: ctin
arch: ctin
paper: https://arxiv.org/abs/2112.02143
code: https://github.com/bingrao/ctin        # 占位仓库，无源码
license: MIT per LICENSE (README badge says Apache-2.0); no code published
commit: 1441c726811ac87283903471562023fd429e3a08
fidelity: paper-only (widths are assumptions from the spec card; parameter count is derived)
args:                      # docs/algorithms/ctin.md §4/§10.9 的推荐默认值（全部为假设 [A]）
  dim: 64
  heads: 8
  encoder_layers: 1        # A.3 的 Nx=1（空间编码器）
  decoder_layers: 4        # A.3 的 Nx=4（时间解码器）
  ff_dim: 512
  kernel_size: 3
  groups: 4
  reduction: 2
  encoder_dropout: 0.5     # A.3：空间编码器 0.5
  decoder_dropout: 0.05    # A.3：时间解码器 0.05
input:                     # 论文 A.2：N = m = 200 样本、导航系（z 轴与重力反向）、逐帧 2D 速度
  window: 200
  frame: gravity_world
  orientation: reference
  remove_gravity: false
  target: frame_velocity   # 输出布局 (B, 200, 2)，IVL/CNL 都定义在逐帧速度上（DESIGN §3.1）
  dims: 2
  overlap: mean
loss: ctin_multitask       # 式 (6)-(8)：IVL(Lpv + Lev) + CNL，按 Kendall 同方差不确定度加权
loss_kwargs:
  rate: 200.0              # 积分位置项用的 dt = 1/rate
  position_weight: 1.0
  velocity_weight: 1.0
recipes:
  official:                # 论文 §4 与附录 A.3；未给出的项按规格卡 §5 的推荐默认值
    epochs: 300            # [A]：论文只说依赖早停
    batch: 128             # [A]：论文未给出
    lr: 5.0e-4
    optimizer: adam
    momentum: 0.9
    weight_decay: 1.0e-6
    scheduler: none        # [A]：论文未说明调度
    grad_clip: 0.0
    stride: 10             # 论文按数据集取 20/50/10，IPB 统一为 10（卡 §6）
    augment:               # A.2：随机偏航 + 加性偏置扰动 + 滑窗随机偏移
      - random_yaw
      - {bias_shift: {gyro: 0.05, acc: 0.2}}
      - time_shift
    amp: false
    fitness: loss          # 论文按验证集表现早停（patience 30）
    patience: 30
  unified:                 # IPB 统一预算（epochs/优化器/调度用 default.yaml）
    augment:               # 增强属于算法本身，两个配方一致（DESIGN §4）
      - random_yaw
      - {bias_shift: {gyro: 0.05, acc: 0.2}}
      - time_shift
# 已知差异：论文没有 MSE→NLL 的阶段切换（iMoT 复现时自行加了热身），两个配方都不加热身。
