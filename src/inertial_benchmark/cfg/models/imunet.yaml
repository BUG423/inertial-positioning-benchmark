# IMUNet：深度可分离残差网络 + “噪声层”（Zeinali et al., "IMUNet: Efficient Regression
# Architecture for Inertial IMU Navigation and Positioning", IEEE TIM 2024）。
# 结构与配方依据 docs/algorithms/imunet.md 规格卡独立实现（洁净室）。
# 许可风险：官方仓库无 LICENSE（保留全部权利），不得复制其代码或分发其权重。
name: imunet
arch: imunet
paper: https://arxiv.org/abs/2208.00068
code: https://github.com/BehnamZeinali/IMUNet
license: none (no LICENSE in the official repo); this implementation is written from the spec card
commit: c57f14d0f4f5bbb8e29d836dabacc8718ca825e1
fidelity: official-code
args:                      # RONIN_torch/main.py get_model()：window_size=200, n_class=2
  base_plane: 64
  kernel_size: 3
  trans_planes: 400
  trans_kernel: 2
input:                     # 噪声层把结构锁死在 6×200 = 1200，window 必须为 200
  window: 200
  frame: gravity_world
  orientation: reference   # 官方用设备姿态（game RV）；复现官方测试时设 orientation=device
  remove_gravity: false
  target: avg_velocity
  dims: 2
recipes:
  official:                # main.py 第 173–295、589–591 行
    epochs: 300
    batch: 128
    val_batch: 512
    lr: 1.0e-4
    optimizer: adam
    momentum: 0.9
    weight_decay: 0.0
    scheduler: plateau     # ReduceLROnPlateau(factor=0.1, patience=10, eps=1e-12) on val MSE
    gamma: 0.1
    plateau_patience: 10
    grad_clip: 0.0
    stride: 10
    eval_stride: 10
    amp: false
    augment: [random_yaw, time_shift]   # RandomHoriRotate(2π) + ±5 样本随机平移
    fitness: loss          # 官方按最低验证 MSE 保存 checkpoint_best.pt
    patience: 0
  unified: {}              # 使用 default.yaml 的统一预算
