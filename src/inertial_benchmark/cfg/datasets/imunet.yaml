# IMUNet_dataset（Zeinali et al., IEEE TIM 2024）。
name: imunet
path: imunet
splits:
  train: train
  val: val
  test: test
test_splits: [test]
notes: >-
  约 200 Hz 手机数据，参考为同设备 Tango VIO 或 ARCore VIO（相机位姿已换到 Android 机体系）。
  使用数据包自带的 list_train/list_test（按序列划分，受试者跨划分：seen-subject 设定）；
  val 由流水线按受试者抽取。小米 11 条（加速度计比例 0.90–0.92）与一条逐字节重复序列被拒收。
