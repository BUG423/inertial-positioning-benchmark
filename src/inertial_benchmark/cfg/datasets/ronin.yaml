# RoNIN（Herath et al., ICRA 2020）公开子集（约 50%）。https://ronin.cs.sfu.ca/
name: ronin
path: ronin                 # 相对 IPB_DATASETS
splits:                     # 逻辑划分 → splits/<file>.txt
  train: train
  val: val
  test: test                # test = test_seen ∪ test_unseen
test_splits: [test_seen, test_unseen]
notes: >-
  官方只公开约一半数据，不能与原论文全量结果直接对比；参考位置来自胸前固定的 Tango 手机（VIO），
  IMU 来自任意携带的另一部手机，参考姿态为起点对齐后的手机姿态。官方 test_seen 与 train 共享受试者
  （seen-subject 设定，ipb check 报告为警告），test_unseen 受试者不相交。
