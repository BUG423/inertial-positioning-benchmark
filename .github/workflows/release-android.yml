name: Release Android Tool

on:
  push:
    tags:
      - "inertial-lab-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/inertial-positioning-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Name release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/InertialLab-${GITHUB_REF_NAME}-debug.apk"
      - name: Create GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/InertialLab-${GITHUB_REF_NAME}-debug.apk#Android debug preview APK"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Inertial Positioning Lab ${GITHUB_REF_NAME#inertial-lab-}"
