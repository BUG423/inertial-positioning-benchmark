name: CI

on:
  push:
  pull_request:

jobs:
  benchmark-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      # CPU 版 PyTorch，避免下载 CUDA 依赖
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[train,test]" ruff
      - run: ruff check src tests
      - run: python -m compileall -q src tests tools
      - run: pytest -q

  android-tool:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/inertial-positioning-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/inertial-positioning-lab/requirements-dev.txt
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: InertialLab-debug
          path: tools/inertial-positioning-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
