excluded:
- name: RepViT
  reason: Vision backbone (mobile ViT-style CNN for images); no inertial odometry model, task or protocol to reproduce.
- name: CPUBone
  reason: Vision backbone optimised for CPU inference; not an inertial positioning method.
- name: MoRPINet
  reason: Targets wheeled / snake-like (serpentine) robot motion, not pedestrian inertial positioning; its motion model does
    not transfer to IPB datasets.
- name: TALOS-NIO
  reason: No accompanying paper and no license; cannot be specified from a citable source or redistributed.
- name: AI-IO
  reason: Requires rotor speed / thrust (actuator) inputs that pedestrian datasets do not have.
- name: IMO
  reason: Requires rotor speed / thrust (actuator) inputs that pedestrian datasets do not have.
