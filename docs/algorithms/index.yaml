- name: velobins
  display_name: VeloBins (binned velocity + error-conditioned Gaussian labels)
  priority: paper-only
  family: airio
  card: docs/algorithms/velobins.md
  fixture: null
  fidelity: paper-only
  paper:
    title: 'VeloBins: Learning Velocity and Its Uncertainty via Bins and Error-Conditioned Gaussian Labels for Aerial Inertial
      Odometry'
    venue: arXiv preprint
    year: 2026
    url: https://arxiv.org/abs/2608.29720
  repo:
    url: null
    commit: null
    license: n/a (code promised upon acceptance)
    framework: none
  input:
    rate_hz: 100
    window: 100
    stride: null
    frame: body
    orientation: none
    remove_gravity: false
    channels: '[acc, gyro, rotor_rpm_or_pwm]'
    extra:
    - rotor_speed_or_pwm
  output:
    quantity: body_velocity_bins
    dims: 3
    uncertainty: bin_variance
  params:
    official: 76600
    benchmark: 69968
  requires_orientation: false
  official_datasets:
  - AI-IO
  - NanoBench
  - TII-RATM
  - NeuroBEM
  status: spec-partial
  pitfalls:
  - Per-axis (x, y, z) independent classification over N=512 bins on a shared symmetric range [-R, R], R ~= 1.1 x train-split
    axis-wise max speed; NOT a joint 2-D/3-D binning.
  - Velocity is decoded as the expectation over bin centres (Eq. 1) and the uncertainty as the variance of the same distribution
    (Eq. 2); argmax is never used.
  - Supervision is KL(q||pi) with an error-conditioned Gaussian label (sigma = |v_hat - v| detached, floored at 1/10 bin width,
    CDF-discretised then exponentially tilted so the label mean is exactly v) plus a Huber loss (delta=0.1 m/s); no NLL loss
    at all.
  - 'Official input needs rotor RPM/PWM, which pedestrian datasets do not have: the IPB variant drops that branch and is not
    the paper configuration.'
  - Encoder details are inherited from AI-IO and not restated, so only the 6,848-parameter bin decoder can be reproduced exactly.
  - Bin grid is fixed per dataset; out-of-range velocities are clipped by construction and the paper does not say how they
    are handled.
  notes: IPB needs a switchable decode mode (expectation / argmax / topk_expectation) and a reusable 'bins' head so the regression-vs-classification
    comparison can run on pedestrian backbones.
